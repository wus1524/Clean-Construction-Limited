<!-- Font Awesome Link (Place this in your <head> or at the top of your body) -->
<link rel="stylesheet" href="https://cloudflare.com">

<section class="contact-section">
  <div class="contact-container">
    <h2>Get in Touch</h2>
    <p class="contact-subtitle">We would love to hear from you. Please reach out using any of the methods below.</p>
    
    <div class="contact-grid">
      <!-- Location Card -->
      <div class="contact-card">
        <div class="icon-wrapper">
          <i class="fas fa-map-marker-alt"></i>
        </div>
        <h3>Our Location</h3>
        <p>123 Business Avenue, Suite 100<br>Frankfurt, Germany</p>
      </div>

      <!-- Contact/Phone Card -->
      <div class="contact-card">
        <div class="icon-wrapper">
          <i class="fas fa-phone-alt"></i>
        </div>
        <h3>Call Us</h3>
        <p>Mon-Fri · 9am - 6pm<br><a href="tel:+49123456789">+49 123 456 789</a></p>
      </div>

      <!-- Email Card -->
      <div class="contact-card">
        <div class="icon-wrapper">
          <i class="fas fa-envelope"></i>
        </div>
        <h3>Email Us</h3>
        <p>Drop us a line anytime<br><a href="mailto:hello@yourdomain.com">hello@yourdomain.com</a></p>
      </div>
    </div>
  </div>
</section>
